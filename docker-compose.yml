services:
  postgres:
    image: postgres:15-alpine
    container_name: realestate_postgres
    environment:
      POSTGRES_USER: realestate_user
      POSTGRES_PASSWORD: realestate_password
      POSTGRES_DB: real_estate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate_user -d real_estate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    # Pinned to a version that can read the on-disk segment format in the
    # existing qdrant_data volume; qdrant:latest (1.19.x) panics on it.
    image: qdrant/qdrant:v1.11.0
    container_name: realestate_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: